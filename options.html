<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>谷谷网申助手 · 个人档案</title>
  </head>
  <body>
    <main class="options-shell">
      <header class="options-header">
        <div><p class="eyebrow">LOCAL-FIRST PROFILE</p><h1>谷谷网申助手</h1><p>资料默认仅保存在当前浏览器。你可以导入简历后校对，也可以直接手动填写。</p></div>
        <span id="saveState" class="save-state">尚未修改</span>
      </header>

      <section class="card import-card">
        <div><h2>从简历开始</h2><p>支持 PDF、DOCX、TXT、Markdown 和 JSON。解析在浏览器本地完成，导入后请检查识别结果。</p></div>
        <label class="file-button">选择简历<input id="resumeFile" type="file" accept=".pdf,.docx,.txt,.md,.json,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain,application/json" /></label>
        <p id="importState" class="inline-state"></p>
      </section>

      <form id="profileForm">
        <section class="card">
          <h2>基本信息</h2>
          <div class="form-grid">
            <label>姓名<input name="fullName" autocomplete="name" /></label>
            <label>常用称呼<input name="preferredName" /></label>
            <label>手机号<input name="phone" autocomplete="tel" /></label>
            <label>邮箱<input name="email" type="email" autocomplete="email" /></label>
            <label>性别<input name="gender" placeholder="男 / 女 / 其他 / 不填写" /></label>
            <label>出生日期<input name="birthDate" type="date" /></label>
            <label>现居地<input name="location" /></label>
            <label>期望城市<input name="preferredLocation" /></label>
            <label>个人网站<input name="website" type="url" /></label>
            <label>GitHub<input name="github" type="url" /></label>
          </div>
        </section>

        <section class="card">
          <h2>教育经历</h2>
          <div class="form-grid">
            <label>学校<input name="school" /></label>
            <label>专业<input name="major" /></label>
            <label>学历<input name="degree" placeholder="本科 / 硕士 / 博士" /></label>
            <label>GPA<input name="gpa" /></label>
            <label>入学时间<input name="educationStart" placeholder="2022-09" /></label>
            <label>毕业时间<input name="educationEnd" placeholder="2026-06" /></label>
          </div>
        </section>

        <section class="card">
          <h2>经历与能力</h2>
          <div class="stacked-fields">
            <label>个人简介<textarea name="summary" rows="4" placeholder="用于自我介绍、个人优势等开放题"></textarea></label>
            <label>技能<textarea name="skills" rows="3" placeholder="Python、FastAPI、数据分析……"></textarea></label>
            <label>实习 / 工作经历<textarea name="experience" rows="7" placeholder="建议包含单位、岗位、日期、职责和可核实成果"></textarea></label>
            <label>项目经历<textarea name="projects" rows="7"></textarea></label>
            <label>获奖经历<textarea name="awards" rows="4"></textarea></label>
          </div>
        </section>

        <section class="card">
          <div class="section-heading"><div><h2>二档：AI 辅助润色</h2><p>兼容 OpenAI 风格接口。默认不保存密钥；AI 只改写你提供的事实，结果必须逐项确认。</p></div><label class="switch-label"><input id="aiEnabled" type="checkbox" />启用</label></div>
          <div id="aiSettings" class="form-grid ai-settings">
            <label>接口地址<input id="aiBaseUrl" type="url" placeholder="https://api.openai.com/v1" /></label>
            <label>模型<input id="aiModel" placeholder="模型名称" /></label>
            <label class="wide">API Key<input id="aiKey" type="password" autocomplete="off" placeholder="仅在你主动使用 AI 时发送给配置的接口" /></label>
            <label class="switch-label wide"><input id="rememberKey" type="checkbox" />在此浏览器持久保存 Key（浏览器扩展存储并非加密保险箱）</label>
            <label class="wide">润色偏好<textarea id="aiInstructions" rows="3" placeholder="例如：技术岗强调工程深度，外企语气克制；不得虚构任何经历或数字。"></textarea></label>
            <button id="authorizeAi" class="secondary compact" type="button">授权访问该 AI 接口</button>
          </div>
        </section>

        <section class="card raw-card">
          <details><summary>查看简历原始文本</summary><textarea id="resumeRawText" rows="14" placeholder="导入简历后保存在本机，用于补全和 AI 辅助；可随时清空。"></textarea></details>
        </section>

        <div class="actions"><button class="primary save" type="submit">保存个人档案</button><button id="clearProfile" class="danger" type="button">清空本机资料</button></div>
      </form>
    </main>
    <script type="module" src="/src/options.ts"></script>
  </body>
</html>
